[phases.setup]
nixPkgs = ["nodejs_20", "python311", "uv"]

[phases.install]
cmds = [
  "cd frontend && npm install",
  "cd backend && uv pip install --system -r requirements.txt"
]

[phases.build]
cmds = [
  "cd frontend && npm run build"
]

[start]
cmd = "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
