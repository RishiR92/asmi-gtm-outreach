name: Deploy to Railway & Trigger Scout

on:
  push:
    branches: [main]

jobs:
  deploy-and-scout:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Wait for Railway Deployment
        run: |
          echo "Railway auto-deploys on git push (GitHub app configured)"
          echo "SERPAPI_KEY included in railway.toml"
          sleep 60

      - name: Trigger Scout on Production
        run: |
          echo "Triggering scout to populate communities with emails..."
          curl -X POST https://asmi-gtm-outreach-production.up.railway.app/api/leads/scout/run-now
          echo "Scout initiated - will run in background"
